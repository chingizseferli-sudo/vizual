[pytest]
testpaths = rss page_change
python_files = test_*.py
# Legacy fixture files are plain scripts with a main(); collect it as a test.
python_functions = test_* main
# test_sources_readability.py is the source-readability job, not a test module.
addopts = --import-mode=importlib --ignore=rss/test_sources_readability.py -p no:cacheprovider
